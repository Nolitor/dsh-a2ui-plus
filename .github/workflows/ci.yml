name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run verify
      # Real-React render check over the in-repo fixtures (no network: the pinned
      # official examples live in tests/fixtures/examples).
      - run: npm run render
      # Throwaway DSH home: install layout, bundle toggle and version skew.
      - run: npm run verify:fresh-home
      - name: Manifest is installable
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if(!p.dsh?.client) throw new Error('missing dsh.client'); if(!p.engines?.dsh) throw new Error('missing engines.dsh'); console.log('manifest ok', p.name, p.version)"
